<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ALBA – International Premium Web Agency</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ALBA is an international premium African web agency. Websites, e-commerce, SEO, Mobile Money payments.">

<style>
body{margin:0;font-family:system-ui,Arial;background:#0f1f1c;color:#fff}
header{position:sticky;top:0;z-index:1000;background:#0b3d2e;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
nav a{margin:0 12px;color:#fff;font-weight:500;text-decoration:none}
nav a:hover{color:#c49a3a}
.lang button{margin-left:6px;padding:6px 12px;border:none;background:#c49a3a;font-weight:bold;cursor:pointer}

section{padding:80px 20px}
.hero{text-align:center;background:linear-gradient(135deg,#0b3d2e,#c49a3a)}
.hero h1{font-size:42px}
.hero p{max-width:760px;margin:20px auto;font-size:18px}

.btn{display:inline-block;margin:10px;padding:14px 32px;background:#000;color:#fff;font-weight:bold;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:35px}
.card{background:#1e3d34;padding:28px;border-radius:8px}
.price{font-size:28px;color:#c49a3a;margin:12px 0}
.pay-btn{width:100%;padding:14px;margin-top:10px;background:#c49a3a;border:none;font-weight:bold;cursor:pointer}

footer{text-align:center;padding:30px;background:#0b3d2e}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:15px 22px;border-radius:40px;font-weight:bold;text-decoration:none}

@media(max-width:768px){
.hero h1{font-size:30px}
header{flex-direction:column}
}
</style>
</head>

<body>

<header>
 <strong style="font-size:28px;color:#c49a3a">ALBA</strong>
 <nav>
  <a href="#home" id="nav-home"></a>
  <a href="#services" id="nav-services"></a>
  <a href="#pricing" id="nav-pricing"></a>
  <a href="#contact" id="nav-contact"></a>
 </nav>
 <div class="lang">
  <button onclick="setLang('fr')">FR</button>
  <button onclick="setLang('en')">EN</button>
 </div>
</header>

<section id="home" class="hero">
 <h1 id="home-title"></h1>
 <p id="home-text"></p>
 <a href="#pricing" class="btn" id="home-btn-pricing"></a>
 <a href="#" class="btn" onclick="contactWhatsApp()" id="home-btn-contact"></a>
</section>

<section id="services">
 <h2 id="services-title"></h2>
 <div class="grid" id="services-list"></div>
</section>

<section id="pricing">
 <h2 id="pricing-title"></h2>
 <div class="grid">
  <div class="card">
   <h3 id="offer1-title"></h3>
   <p id="offer1-desc"></p>
   <div class="price">300 €</div>
   <button class="pay-btn" onclick="pay('Essentiel / Essential',300)" id="pay1"></button>
  </div>
  <div class="card">
   <h3 id="offer2-title"></h3>
   <p id="offer2-desc"></p>
   <div class="price">700 €</div>
   <button class="pay-btn" onclick="pay('Business',700)" id="pay2"></button>
  </div>
  <div class="card">
   <h3 id="offer3-title"></h3>
   <p id="offer3-desc"></p>
   <div class="price" id="offer3-price"></div>
   <a href="#" class="btn" onclick="requestQuote()" id="offer3-btn"></a>
  </div>
 </div>
</section>

<section id="contact">
 <h2 id="contact-title"></h2>
 <p id="contact-text"></p>
 <a href="#" class="btn" onclick="contactWhatsApp()" id="contact-btn"></a>
</section>

<a href="#" class="whatsapp" onclick="contactWhatsApp()">WhatsApp</a>

<footer>
© 2026 ALBA — International Premium Web Agency
</footer>

<script>
const phone="22377231570";
let lang="fr";

const content={
fr:{
 nav:["Accueil","Services","Tarifs","Contact"],
 homeTitle:"Agence Web Internationale Premium",
 homeText:"ALBA conçoit des sites web haut de gamme et des solutions digitales pour entreprises africaines et internationales.",
 pricingBtn:"Voir les offres",
 contactBtn:"WhatsApp",
 payBtn:"Payer via Mobile Money",
 servicesTitle:"Nos Services",
 services:[
  "Sites web professionnels & corporate",
  "Plateformes e-commerce internationales",
  "Applications web sur mesure",
  "SEO international & visibilité Google",
  "Maintenance, sécurité & performance",
  "Branding & identité visuelle premium"
 ],
 pricingTitle:"Offres & Tarifs",
 o1:"Essentiel",o1d:"Site vitrine professionnel (5 pages)",
 o2:"Business",o2d:"Site + SEO + support prioritaire",
 o3:"Elite",o3d:"Projet international sur mesure",o3p:"Sur devis",o3b:"Demander un devis",
 contactTitle:"Contact",
 contactText:"Paiement Mobile Money • Support 7j/7 • Facture fournie"
},
en:{
 nav:["Home","Services","Pricing","Contact"],
 homeTitle:"International Premium Web Agency",
 homeText:"ALBA builds high-end websites and digital solutions for African and international companies.",
 pricingBtn:"View pricing",
 contactBtn:"WhatsApp",
 payBtn:"Pay via Mobile Money",
 servicesTitle:"Our Services",
 services:[
  "Professional & corporate websites",
  "International e-commerce platforms",
  "Custom web applications",
  "International SEO & Google visibility",
  "Maintenance, security & performance",
  "Premium branding & visual identity"
 ],
 pricingTitle:"Pricing",
 o1:"Essential",o1d:"Professional website (5 pages)",
 o2:"Business",o2d:"Website + SEO + priority support",
 o3:"Elite",o3d:"Custom international project",o3p:"Custom quote",o3b:"Request a quote",
 contactTitle:"Contact",
 contactText:"Mobile Money payment • 7-day support • Invoice provided"
}
};

function setLang(l){
 lang=l;
 document.documentElement.lang=l;
 document.getElementById("nav-home").textContent=content[l].nav[0];
 document.getElementById("nav-services").textContent=content[l].nav[1];
 document.getElementById("nav-pricing").textContent=content[l].nav[2];
 document.getElementById("nav-contact").textContent=content[l].nav[3];
 document.getElementById("home-title").textContent=content[l].homeTitle;
 document.getElementById("home-text").textContent=content[l].homeText;
 document.getElementById("home-btn-pricing").textContent=content[l].pricingBtn;
 document.getElementById("home-btn-contact").textContent=content[l].contactBtn;
 document.getElementById("services-title").textContent=content[l].servicesTitle;
 document.getElementById("services-list").innerHTML=content[l].services.map(s=>`<div class="card">${s}</div>`).join("");
 document.getElementById("pricing-title").textContent=content[l].pricingTitle;
 document.getElementById("offer1-title").textContent=content[l].o1;
 document.getElementById("offer1-desc").textContent=content[l].o1d;
 document.getElementById("offer2-title").textContent=content[l].o2;
 document.getElementById("offer2-desc").textContent=content[l].o2d;
 document.getElementById("offer3-title").textContent=content[l].o3;
 document.getElementById("offer3-desc").textContent=content[l].o3d;
 document.getElementById("offer3-price").textContent=content[l].o3p;
 document.getElementById("offer3-btn").textContent=content[l].o3b;
 document.getElementById("contact-title").textContent=content[l].contactTitle;
 document.getElementById("contact-text").textContent=content[l].contactText;
 document.getElementById("contact-btn").textContent=content[l].contactBtn;
 document.getElementById("pay1").textContent=content[l].payBtn;
 document.getElementById("pay2").textContent=content[l].payBtn;
}

function contactWhatsApp(){
 const msg=lang==="fr"
 ? "Bonjour ALBA, je souhaite des informations. Merci de préciser votre pays et votre opérateur Mobile Money."
 : "Hello ALBA, I would like information. Please specify your country and your Mobile Money operator.";
 window.open(`https://wa.me/${phone}?text=`+encodeURIComponent(msg));
}

function pay(offer,price){
 const msg=lang==="fr"
 ? `Bonjour ALBA, je souhaite payer l'offre ${offer} (${price}€). Merci de préciser votre pays et votre opérateur Mobile Money.`
 : `Hello ALBA, I would like to pay for ${offer} (€${price}). Please specify your country and your Mobile Money operator.`;
 window.open(`https://wa.me/${phone}?text=`+encodeURIComponent(msg));
}

function requestQuote(){contactWhatsApp();}
setLang("fr");
</script>

</body>
</html>
